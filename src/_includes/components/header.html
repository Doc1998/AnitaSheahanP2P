<style>
  /* ── TOKENS (subset needed for header) ── */
  :root {
    --sage:        #6d9b7f;
    --sage-light:  #9cbfaa;
    --sage-pale:   #eef5f0;
    --bark:        #3b332b;
    --bark-mid:    #5e5449;
    --cream:       #fdfaf6;
    --white:       #ffffff;
    --border:      rgba(109,155,127,.18);
    --shadow-sm:   0 2px 12px rgba(59,51,43,.07);
    --font-display: 'Cormorant Garamond', Georgia, serif;
    --font-body:    'DM Sans', system-ui, sans-serif;
  }

  /* ── TOP BAR ── */
  .topbar {
    background: var(--bark);
    color: rgba(253,250,246,.80);
    font-size: .8rem;
    padding: 10px 0;
  }
  .topbar .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 28px;
  }
  .topbar__inner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .topbar__badges {
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .topbar__badge {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .topbar__phone a {
    color: #e8a090;
    font-weight: 500;
    transition: color .15s;
  }
  .topbar__phone a:hover { color: var(--white); }

  /* Hide badges on mobile, keep phone only */
  @media (max-width: 768px) {
    .topbar__badges { display: none; }
    .topbar__inner  { justify-content: flex-end; }
  }

  /* ── NAV ── */
  .nav {
    background: var(--cream);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .nav .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 28px;
  }
  .nav__inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 0;
    gap: 24px;
  }
  .nav__logo {
    font-family: var(--font-display);
    font-size: 1.45rem;
    font-weight: 400;
    color: var(--bark);
    line-height: 1.2;
    text-decoration: none;
    z-index: 200;
    position: relative;
  }
  .nav__logo span { color: var(--sage); font-style: italic; }

  /* Desktop links */
  .nav__links {
    display: flex;
    gap: 32px;
    list-style: none;
  }
  .nav__links a {
    font-size: .88rem;
    font-weight: 400;
    color: var(--bark-mid);
    transition: color .15s;
    text-decoration: none;
  }
  .nav__links a:hover { color: var(--sage); }

  /* Desktop CTA */
  .nav__cta {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .nav__cta .btn--outline {
    background: transparent;
    border: 1.5px solid var(--sage);
    color: var(--sage);
    padding: 10px 22px;
    border-radius: 50px;
    font-family: var(--font-body);
    font-size: .88rem;
    font-weight: 500;
    text-decoration: none;
    transition: transform .2s, box-shadow .2s;
    white-space: nowrap;
  }
  .nav__cta .btn--outline:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(109,155,127,.25); }

  .nav__cta .btn--primary {
    background: var(--sage);
    color: var(--white);
    padding: 11px 24px;
    border-radius: 50px;
    font-family: var(--font-body);
    font-size: .88rem;
    font-weight: 500;
    text-decoration: none;
    transition: transform .2s, box-shadow .2s;
    white-space: nowrap;
  }
  .nav__cta .btn--primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(109,155,127,.35); }

  /* ── HAMBURGER BUTTON ── */
  .nav__hamburger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    width: 40px;
    height: 40px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
    z-index: 200;
    position: relative;
  }
  .nav__hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--bark);
    border-radius: 2px;
    transition: transform .3s ease, opacity .3s ease;
    transform-origin: center;
  }
  /* Animate to X when open */
  .nav__hamburger.is-open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .nav__hamburger.is-open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  .nav__hamburger.is-open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  /* ── MOBILE OVERLAY MENU ── */
  .nav__overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--cream);
    z-index: 150;
    flex-direction: column;
    padding: 100px 32px 48px;
    opacity: 0;
    transform: translateY(-12px);
    transition: opacity .3s ease, transform .3s ease;
    pointer-events: none;
  }
  .nav__overlay.is-open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: all;
  }
  .nav__overlay-links {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 40px;
  }
  .nav__overlay-links a {
    font-family: var(--font-display);
    font-size: 2.2rem;
    font-weight: 400;
    color: var(--bark);
    text-decoration: none;
    display: block;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    transition: color .15s;
    line-height: 1.2;
  }
  .nav__overlay-links a:hover { color: var(--sage); }
  .nav__overlay-links li:last-child a { border-bottom: none; }

  .nav__overlay-cta {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .nav__overlay-cta a {
    display: block;
    text-align: center;
    padding: 16px;
    border-radius: 50px;
    font-family: var(--font-body);
    font-size: 1rem;
    font-weight: 500;
    text-decoration: none;
    transition: transform .2s;
  }
  .nav__overlay-cta a:hover { transform: translateY(-1px); }
  .nav__overlay-cta .btn--primary { background: var(--sage); color: var(--white); }
  .nav__overlay-cta .btn--outline { border: 1.5px solid var(--sage); color: var(--sage); background: transparent; }

  /* ── RESPONSIVE BREAKPOINTS ── */
  @media (max-width: 768px) {
    .nav__links       { display: none; }
    .nav__cta         { display: none; }
    .nav__hamburger   { display: flex; }
    .nav__overlay     { display: flex; }
  }

  /* Prevent scroll when menu open */
  body.nav-open { overflow: hidden; }
</style>

<!-- ============================================================
     HAMBURGER JS
     ============================================================ -->
<script>
  const hamburger = document.getElementById('hamburger');
  const overlay   = document.getElementById('nav-overlay');

  hamburger.addEventListener('click', () => {
    const isOpen = hamburger.classList.toggle('is-open');
    overlay.classList.toggle('is-open');
    hamburger.setAttribute('aria-expanded', isOpen);
    overlay.setAttribute('aria-hidden', !isOpen);
    document.body.classList.toggle('nav-open', isOpen);
  });

  // Close on any overlay link click
  overlay.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      hamburger.classList.remove('is-open');
      overlay.classList.remove('is-open');
      hamburger.setAttribute('aria-expanded', false);
      overlay.setAttribute('aria-hidden', true);
      document.body.classList.remove('nav-open');
    });
  });
</script>
